<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" style="max-width:340px" font-family="inherit"><text x="8" y="14" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">MEANING</text><path d="M60 50 Q60 40 70 40 L220 40 L240 65 L240 85 L220 110 L70 110 Q60 110 60 100 Z" fill="#339af0" fill-opacity=".25" stroke="none" /><path d="M60 50 Q60 40 70 40 L220 40 L240 65 M240 85 L220 110 L70 110 Q60 110 60 100 Z" fill="none" stroke="currentColor" stroke-width="2" /><rect x="240" y="65" width="45" height="20" fill="#339af0" fill-opacity=".35" stroke="#f08c00" stroke-width="2.5" /><circle cx="300" cy="75" r="3" fill="#339af0" /><circle cx="318" cy="75" r="3" fill="#339af0" /><circle cx="336" cy="75" r="3" fill="#339af0" /><text x="265" y="54" font-size="11" text-anchor="middle" fill="#f08c00">bottleneck</text><text x="180" y="125" font-size="11" text-anchor="middle" fill="currentColor">the narrowest part sets the speed</text><line x1="0" y1="130" x2="360" y2="130" stroke="currentColor" stroke-opacity=".2" /><text x="8" y="145" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">EXAMPLE</text><rect x="8" y="176" width="20" height="48" rx="3" fill="none" stroke="currentColor" stroke-width="1.5" /><rect x="30" y="180" width="140" height="40" fill="#339af0" fill-opacity=".2" stroke="currentColor" stroke-width="1.5" /><polygon points="50,194 58,200 50,206" fill="currentColor" fill-opacity=".5" /><polygon points="140,194 148,200 140,206" fill="currentColor" fill-opacity=".5" /><circle cx="100" cy="200" r="11" fill="#37b24d" /><text x="100" y="204" font-size="12" text-anchor="middle" fill="#fff">3</text><text x="100" y="173" font-size="11" text-anchor="middle" fill="currentColor">round trips</text><text x="100" y="236" font-size="10" text-anchor="middle" fill="#37b24d">fixed by number 3</text><rect x="170" y="194" width="130" height="12" fill="#f08c00" fill-opacity=".3" stroke="#f08c00" stroke-width="2" /><text x="235" y="188" font-size="11" text-anchor="middle" fill="#f08c00">bytes on 4G</text><text x="235" y="221" font-size="11" text-anchor="middle" fill="#f08c00">real limit</text><rect x="305" y="178" width="24" height="44" rx="4" fill="none" stroke="currentColor" stroke-width="1.5" /><line x1="313" y1="216" x2="321" y2="216" stroke="currentColor" stroke-width="1.5" /><text x="330" y="256" font-size="11" text-anchor="end" fill="#fa5252">page still slow</text></svg>
