<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" width="100%" style="max-width:340px" font-family="inherit"><text x="10" y="16" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">MEANING</text><rect x="20" y="50" width="80" height="40" rx="6" fill="none" stroke="currentColor" /><text x="60" y="74" font-size="12" text-anchor="middle" fill="currentColor">client</text><rect x="260" y="50" width="80" height="40" rx="6" fill="none" stroke="currentColor" /><text x="300" y="74" font-size="12" text-anchor="middle" fill="currentColor">server</text><line x1="102" y1="60" x2="252" y2="60" stroke="currentColor" stroke-width="1.5" /><polygon points="258,60 250,56 250,64" fill="currentColor" /><text x="180" y="53" font-size="11" text-anchor="middle" fill="currentColor">request</text><line x1="258" y1="80" x2="108" y2="80" stroke="currentColor" stroke-width="1.5" /><polygon points="102,80 110,76 110,84" fill="currentColor" /><text x="180" y="94" font-size="11" text-anchor="middle" fill="currentColor">response</text><path d="M102 104 v8 h156 v-8" fill="none" stroke="#f08c00" stroke-width="2" /><text x="180" y="129" font-size="12" text-anchor="middle" fill="#f08c00">round trip ≥ 1 latency</text><line x1="0" y1="140" x2="360" y2="140" stroke="currentColor" stroke-opacity=".2" /><text x="10" y="156" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">EXAMPLE</text><g font-size="11" text-anchor="middle" fill="currentColor"><rect x="15" y="190" width="45" height="30" rx="5" fill="none" stroke="currentColor" /><text x="37.5" y="209">app</text><rect x="110" y="190" width="45" height="30" rx="5" fill="none" stroke="currentColor" /><text x="132.5" y="209">auth</text><rect x="205" y="190" width="45" height="30" rx="5" fill="none" stroke="currentColor" /><text x="227.5" y="209">api</text><rect x="300" y="190" width="45" height="30" rx="5" fill="none" stroke="currentColor" /><text x="322.5" y="209">db</text><text x="85" y="184" fill-opacity=".7">hop</text><text x="180" y="184" fill-opacity=".7">hop</text><text x="275" y="184" fill-opacity=".7">hop</text></g><g stroke="#f08c00" stroke-width="1.5"><line x1="62" y1="199" x2="103" y2="199" /><line x1="108" y1="211" x2="67" y2="211" /><line x1="157" y1="199" x2="198" y2="199" /><line x1="203" y1="211" x2="162" y2="211" /><line x1="252" y1="199" x2="293" y2="199" /><line x1="298" y1="211" x2="257" y2="211" /></g><g fill="#f08c00"><polygon points="108,199 101,195.5 101,202.5" /><polygon points="62,211 69,207.5 69,214.5" /><polygon points="203,199 196,195.5 196,202.5" /><polygon points="157,211 164,207.5 164,214.5" /><polygon points="298,199 291,195.5 291,202.5" /><polygon points="252,211 259,207.5 259,214.5" /><circle cx="85" cy="237" r="8" /><circle cx="180" cy="237" r="8" /><circle cx="275" cy="237" r="8" /></g><g font-size="10" text-anchor="middle" fill="#fff"><text x="85" y="241">1</text><text x="180" y="241">2</text><text x="275" y="241">3</text></g><text x="180" y="272" font-size="11" text-anchor="middle" fill="currentColor">3 hops = <tspan fill="#f08c00">3 round trips</tspan>, waited in turn</text></svg>
