<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" width="100%" style="max-width:340px" font-family="inherit"><title>trickle in: drops fall one at a time, like requests arriving seconds apart</title><text x="80" y="20" font-size="12" text-anchor="middle" fill="currentColor">drip... drip</text><path d="M12 42 H84 Q96 42 96 54 V64 H82 V56 H12 Z" fill="currentColor" /><rect x="42" y="30" width="8" height="12" fill="currentColor" /><line x1="32" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="4" stroke-linecap="round" /><path d="M89 76 Q84 84 89 88 Q94 84 89 76 Z" fill="#f08c00" /><path d="M89 106 Q84 114 89 118 Q94 114 89 106 Z" fill="#f08c00" /><path d="M89 136 Q84 144 89 148 Q94 144 89 136 Z" fill="#f08c00" /><path d="M66 158 L71 190 H107 L112 158" fill="none" stroke="currentColor" stroke-width="2" /><rect x="71" y="182" width="36" height="7" fill="#f08c00" fill-opacity="0.4" /><line x1="148" y1="100" x2="170" y2="100" stroke="currentColor" stroke-width="2" /><polygon points="170,95 178,100 170,105" fill="currentColor" /><text x="250" y="22" font-size="12" text-anchor="middle" fill="currentColor">requests</text><text x="250" y="72" font-size="12" text-anchor="middle" fill="#f08c00" font-weight="bold">trickle in</text><line x1="192" y1="90" x2="306" y2="90" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3" /><rect x="196" y="85" width="14" height="10" rx="2" fill="#f08c00" /><rect x="240" y="85" width="14" height="10" rx="2" fill="#f08c00" /><rect x="286" y="85" width="14" height="10" rx="2" fill="#f08c00" /><text x="203" y="110" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="0.7">0s</text><text x="247" y="110" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="0.7">3s</text><text x="293" y="110" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity="0.7">7s</text><line x1="192" y1="145" x2="306" y2="145" stroke="currentColor" stroke-opacity="0.3" stroke-dasharray="3 3" /><