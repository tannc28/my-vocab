<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 310" width="100%" style="max-width:340px" font-family="inherit"><text x="8" y="14" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">EXAMPLE</text><g stroke="currentColor" stroke-opacity=".4" stroke-width="1.5" fill="none"><polyline points="65,75 90,40 130,75" /><polyline points="30,110 50,75 70,110" stroke-opacity=".2" /><polyline points="110,110 130,75 150,110" stroke-opacity=".2" /><polyline points="245,75 270,40 310,75" /><polyline points="210,110 230,75 250,110" /><polyline points="290,110 310,75 330,110" /></g><g fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.5"><circle cx="90" cy="40" r="9" /><circle cx="30" cy="110" r="9" stroke-opacity=".3" /><circle cx="70" cy="110" r="9" stroke-opacity=".3" /><circle cx="110" cy="110" r="9" stroke-opacity=".3" /><circle cx="150" cy="110" r="9" stroke-opacity=".3" /></g><circle cx="50" cy="75" r="9" fill="#339af0" /><circle cx="130" cy="75" r="9" fill="#fa5252" /><g fill="#fa5252"><circle cx="270" cy="40" r="9" /><circle cx="230" cy="75" r="9" /><circle cx="310" cy="75" r="9" /><circle cx="210" cy="110" r="9" /><circle cx="250" cy="110" r="9" /><circle cx="290" cy="110" r="9" /><circle cx="330" cy="110" r="9" /></g><text x="180" y="80" font-size="15" text-anchor="middle" fill="currentColor">≠</text><text x="90" y="137" font-size="11" text-anchor="middle" fill="currentColor">doc: deletes siblings</text><text x="270" y="137" font-size="11" text-anchor="middle" fill="currentColor">actual: every node</text><line x1="8" y1="150" x2="352" y2="150" stroke="currentColor" stroke-opacity=".2" /><text x="8" y="164" font-size="9" letter-spacing="1" fill="currentColor" fill-opacity=".55">DEEP DIVE</text><g fill="none" stroke="#fa5252" stroke-width="1.5" stroke-dasharray="4 3"><rect x="46" y="200" width="28" height="70" /><rect x="166" y="200" width="28" height="70" /><rect x="286" y="200" width="28" height="70" /></g><g fill="#339af0"><rect x="46" y="240" width="28" height="30" /><rect x="166" y="240" width="28" height="30" /><rect x="286" y="240" width="28" height="30" /></g><line x1="30" y1="270" x2="330" y2="270" stroke="currentColor" stroke-opacity=".4" /><line x1="60" y1="206" x2="60" y2="221" stroke="currentColor" stroke-width="2" /><polygon points="55,219 65,219 60,228" fill="currentColor" /><rect x="40" y="231" width="40" height="6" fill="currentColor" /><text x="180" y="226" font-size="14" text-anchor="middle" fill="currentColor">?</text><g stroke="#f08c00" stroke-width="2" fill="none"><line x1="328" y1="200" x2="328" y2="240" /><line x1="323" y1="200" x2="333" y2="200" /><line x1="323" y1="240" x2="333" y2="240" /></g><text x="60" y="290" font-size="12" text-anchor="middle" fill="currentColor">downplay</text><text x="180" y="290" font-size="12" text-anchor="middle" fill="currentColor">underestimate</text><text x="300" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#f08c00">understate</text><text x="60" y="304" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">on purpose</text><text x="180" y="304" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">by mistake</text><text x="300" y="304" font-size="10" text-anchor="middle" fill="currentColor" fill-opacity=".7">just too low</text></svg>
