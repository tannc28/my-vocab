<!doctype html>
<html lang="vi" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ từ vựng</title>
<meta name="description" content="Toàn bộ từ đã gom được, dựng thẳng từ history.jsonl — cùng nguồn với deck Anki.">
<style>
:root{
  --bg:#f7f7f5; --panel:#fff; --panel2:#faf9f7; --ink:#1c1c1a; --ink2:#55534e; --ink3:#8b8880;
  --line:#e4e2dd; --accent:#b4531f; --accent-bg:#fbf0e8; --ok:#2f7d54; --warn:#9a6b12;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --bg:#15151a; --panel:#1d1d23; --panel2:#23232a; --ink:#ecebe8; --ink2:#a9a7a1; --ink3:#76736c;
    --line:#31313a; --accent:#e0864f; --accent-bg:#2a2019; --ok:#5fb384; --warn:#d6a950;
  }
}
html[data-theme="dark"]{
  --bg:#15151a; --panel:#1d1d23; --panel2:#23232a; --ink:#ecebe8; --ink2:#a9a7a1; --ink3:#76736c;
  --line:#31313a; --accent:#e0864f; --accent-bg:#2a2019; --ok:#5fb384; --warn:#d6a950;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:9px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap;line-height:1.15}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--ink3);font-family:var(--mono)}
.tabs{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px}
.tabs button{border:0;background:none;padding:5px 13px;border-radius:999px;color:var(--ink2);font-size:13px}
.tabs button[aria-selected="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.search{flex:1;min-width:180px;position:relative}
.search input{width:100%;padding:8px 12px 8px 31px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);outline:none;font-size:14px}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--ink3);fill:none;stroke-width:2}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.iconbtn:hover{border-color:var(--accent);color:var(--accent)}
.filters{max-width:1320px;margin:0 auto;padding:0 16px 9px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
select.chip{padding:4px 8px}
.count{color:var(--ink3);font-size:12.5px;margin-left:auto;font-family:var(--mono)}

.wrap{max-width:1320px;margin:0 auto;padding:14px 16px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.wrap.solo{grid-template-columns:1fr}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.day{position:sticky;top:0;z-index:2;background:var(--panel2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 14px;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.day:first-child{border-top:0}
.day b{color:var(--ink2);font-weight:600}
.row{display:flex;gap:9px;align-items:baseline;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 40px}
.row:hover{background:var(--panel2)}
.row[aria-current="true"]{background:var(--accent-bg)}
.row[aria-current="true"] .w{color:var(--accent)}
.w{font-weight:600;font-size:15px;white-space:nowrap}
.pos{font-size:11px;color:var(--accent);font-style:italic;white-space:nowrap}
.gloss{color:var(--ink2);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.rep{font-size:10.5px;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:0 5px;white-space:nowrap}
.empty{padding:36px 16px;text-align:center;color:var(--ink3)}

.detail{position:sticky;top:104px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-height:calc(100vh - 122px);overflow:auto}
@media (max-width:900px){
  .detail{position:fixed;inset:0;z-index:40;border-radius:0;max-height:none;display:none;padding-bottom:70px}
  body.open .detail{display:block}
  body.open .closebtn{display:block}
}
.closebtn{display:none;position:fixed;right:14px;bottom:14px;z-index:41;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 18px;box-shadow:0 4px 18px rgba(0,0,0,.2)}
.hero{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hero h1{font-size:32px;margin:0;letter-spacing:-.02em;line-height:1.2;font-family:var(--serif)}
.ipa{font-family:var(--mono);color:var(--ink3);font-size:14.5px}
.say{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2)}
.say:hover{border-color:var(--accent);color:var(--accent)}
.meta{color:var(--ink3);font-size:11.5px;font-family:var(--mono);margin-top:5px}
.lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:16px 0 5px}
.meaning{font-size:18px;font-family:var(--serif);line-height:1.45}
.colls{display:flex;gap:6px;flex-wrap:wrap}
.coll{background:var(--accent-bg);color:var(--accent);border-radius:6px;padding:2px 9px;font-size:13px}
.ex{border-left:2px solid var(--line);padding:1px 0 1px 12px;margin:0 0 6px;font-style:italic;font-family:var(--serif);font-size:15.5px}
.deep{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink2);font-size:13.5px}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.links a{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12.5px;text-decoration:none;color:var(--ink2)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.dict{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.sense{margin:0 0 5px;padding-left:15px;position:relative;font-size:14px}
.sense::before{content:"";position:absolute;left:3px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--ink3)}
.sense i{display:block;color:var(--ink3);font-size:13px}
.dictpos{font-style:italic;color:var(--accent);font-size:12.5px;margin:10px 0 3px}
.muted{color:var(--ink3);font-size:13px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink3);margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;overflow-x:auto;padding-bottom:2px}
.bar{flex:1 0 7px;min-width:7px;background:var(--accent);opacity:.75;border-radius:2px 2px 0 0;position:relative}
.bar:hover{opacity:1}
.bar.zero{background:var(--line);opacity:1}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);font-family:var(--mono);margin-top:5px}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center;font-size:13px}
.dist .track{display:block;height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.dist .fill{display:block;height:100%;background:var(--accent);opacity:.7;border-radius:4px}
.dist .n{font-family:var(--mono);color:var(--ink3);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.mini{list-style:none;margin:0;padding:0;font-size:13.5px}
.mini li{display:flex;gap:8px;align-items:baseline;padding:3px 0;border-bottom:1px solid var(--line)}
.mini li:last-child{border:0}
.mini b{font-weight:600}
.mini span{color:var(--ink3);font-size:12px;font-family:var(--mono);margin-left:auto;white-space:nowrap}
.mini .clickable{cursor:pointer}
.mini .clickable:hover b{color:var(--accent)}

.gcard{padding:12px 16px;border-bottom:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 92px}
.gbad{font-family:var(--serif);font-size:15.5px;color:var(--ink3)}
.ggood{font-family:var(--serif);font-size:16.5px;font-weight:600;margin-top:2px}
.gfix{margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--ink2)}
.gfix li{margin:3px 0}
.tag{font-size:10.5px;border-radius:4px;padding:1px 6px;background:var(--accent-bg);color:var(--accent);margin-right:6px;white-space:nowrap}
.gday{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.known{display:flex;gap:6px;flex-wrap:wrap;padding:14px}
.known button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 9px;font-size:13.5px;color:var(--ink2)}
.known button:hover{border-color:var(--accent);color:var(--accent)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink3)}
.foot{max-width:1320px;margin:0 auto;padding:0 16px 40px;color:var(--ink3);font-size:12.5px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand">Sổ từ vựng<small id="stamp">đang tải…</small></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="overview" aria-selected="true">Tổng quan</button>
      <button role="tab" data-tab="vocab" aria-selected="false">Từ vựng</button>
      <button role="tab" data-tab="grammar" aria-selected="false">Ngữ pháp</button>
      <button role="tab" data-tab="known" aria-selected="false">Đã biết</button>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Tìm từ, nghĩa, ví dụ…" autocomplete="off" spellcheck="false">
    </div>
    <button class="iconbtn" id="rand" title="Mở một từ bất kỳ">Ngẫu nhiên</button>
    <button class="iconbtn" id="theme" title="Sáng / tối">◐</button>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main class="wrap" id="wrap">
  <section id="list"><div class="empty">Đang tải <code>history.jsonl</code>…</div></section>
  <aside class="detail panel" id="detail" hidden></aside>
</main>
<button class="closebtn" id="close">Đóng</button>
<footer class="foot" id="foot"></footer>

<script>
(function(){
"use strict";

/* ---------------------------------------------------------------- constants */
var API = "https://api.dictionaryapi.dev/api/v2/entries/en/";
var POS_LONG = {n:"noun",v:"verb",adj:"adjective",adv:"adverb",prep:"preposition",
  conj:"conjunction",pron:"pronoun","phr v":"phrasal-verb",idiom:"idiom"};
/* Cột POS trong history là free text ("n, v", "adj/adv"…) nên gom về ít nhóm để lọc. */
var BUCKETS = [["phr v","phrasal verb"],["idiom","idiom"],["adj","tính từ"],["adv","trạng từ"],
  ["prep","giới từ"],["conj","liên từ"],["n","danh từ"],["v","động từ"]];

var S = {tab:"overview", q:"", pos:"", day:"", sort:"new",
         vocab:[], grammar:[], known:[], view:[], current:null, updated:""};

var $ = function(s){ return document.querySelector(s); };
var listEl = $("#list"), detailEl = $("#detail"), filtersEl = $("#filters"), wrapEl = $("#wrap");
var dictCache = new Map();

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function slug(s){ return String(s).toLowerCase().replace(/[^0-9a-z_]+/g,"-").replace(/-+/g,"-").replace(/^-|-$/g,""); }
function stripMd(s){ return String(s == null ? "" : s).replace(/\*{1,2}([^*]+)\*{1,2}/g,"$1"); }
function unhtml(s){ return String(s == null ? "" : s).replace(/<br\s*\/?>/gi,"\n").replace(/&quot;/g,'"'); }
function hash(s){ var h = 5381; for(var i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function bucket(pos){
  var p = String(pos).toLowerCase().trim();
  for(var i = 0; i < BUCKETS.length; i++){ if(p.indexOf(BUCKETS[i][0]) === 0) return BUCKETS[i][0]; }
  return "other";
}
function deepOf(it){ var d = it.deep || it.hint || ""; return Array.isArray(d) ? d.join(" ") : d; }

/* ------------------------------------------------------------------- build
   Cùng luật dedupe với flush_queue.py: khoá là <word>-<pos dạng dài>, lần gặp
   sau thay hẳn lần trước và dời lên ngày mới nhất. Trang này chỉ là một cách
   render history.jsonl — đúng file mà sheet .xlsx cũng được dựng ra từ đó. */
function build(items){
  var index = new Map(), times = new Map(), g = [], seen = new Set();
  items.forEach(function(it){
    var kind = it.kind || "vocab";
    if(kind === "vocab"){
      if(!it.word) return;
      var rawPos = String(it.pos || "").trim();
      var id = slug(it.word) + "-" + slug(POS_LONG[rawPos.toLowerCase()] || rawPos);
      times.set(id, (times.get(id) || 0) + 1);
      index.delete(id);
      index.set(id, {
        id: id,
        word: String(it.word).trim(),
        ipa: String(it.ipa || it[" ipa"] || "").trim(),
        pos: rawPos,
        posKey: bucket(rawPos),
        meaning: stripMd(it.meaning || ""),
        collocation: String(it.collocation || "").trim(),
        example: unhtml(stripMd(it.example || "")),
        deep: unhtml(stripMd(deepOf(it))),
        date: it.date || "",
        times: 1
      });
    } else if(kind === "grammar" && it.original){
      if(seen.has(it.original)) return;
      seen.add(it.original);
      g.push({
        id: "g-" + hash(it.original),
        original: it.original,
        corrected: it.corrected || "",
        fixes: (it.fixes || []).map(function(f){ return {tag: f.tag || "", body: stripMd(unhtml(f.body || ""))}; }),
        deep: unhtml(stripMd(deepOf(it))),
        date: it.date || ""
      });
    }
  });
  var v = Array.from(index.values()).reverse();
  v.forEach(function(r){ r.times = times.get(r.id) || 1; });
  return {vocab: v, grammar: g.reverse()};
}

/* ------------------------------------------------------------------ filter */
function apply(){
  var q = S.q.trim().toLowerCase();
  var src = S.tab === "grammar" ? S.grammar : S.vocab;
  S.view = src.filter(function(r){
    if(S.day && r.date !== S.day) return false;
    if(S.tab === "vocab" && S.pos && r.posKey !== S.pos) return false;
    if(!q) return true;
    var hay = S.tab === "grammar"
      ? r.original + " " + r.corrected + " " + r.fixes.map(function(f){ return f.body; }).join(" ")
      : r.word + " " + r.meaning + " " + r.collocation + " " + r.example + " " + r.deep;
    return hay.toLowerCase().indexOf(q) >= 0;
  });
  if(S.tab === "vocab" && S.sort === "az")
    S.view = S.view.slice().sort(function(a, b){ return a.word.localeCompare(b.word); });
}

/* ------------------------------------------------------------------ render */
function render(){
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)); });
  apply();
  renderFilters();
  if(S.tab === "overview") renderOverview();
  else if(S.tab === "vocab") renderVocab();
  else if(S.tab === "grammar") renderGrammar();
  else renderKnown();
  var solo = (S.tab === "overview" || S.tab === "grammar");
  wrapEl.classList.toggle("solo", solo);
  detailEl.hidden = solo;
}

function renderFilters(){
  if(S.tab === "overview"){ filtersEl.innerHTML = ""; return; }
  var h = [];
  if(S.tab === "vocab"){
    var counts = {};
    S.vocab.forEach(function(r){ counts[r.posKey] = (counts[r.posKey] || 0) + 1; });
    h.push(chip("", "Tất cả", S.pos === ""));
    BUCKETS.forEach(function(b){
      if(counts[b[0]]) h.push(chip(b[0], b[1] + " " + counts[b[0]], S.pos === b[0])); });
    if(counts.other) h.push(chip("other", "khác " + counts.other, S.pos === "other"));
  }
  if(S.tab !== "known"){
    var days = {};
    (S.tab === "grammar" ? S.grammar : S.vocab).forEach(function(r){ days[r.date] = (days[r.date] || 0) + 1; });
    var keys = Object.keys(days).sort().reverse();
    h.push('<select class="chip" id="daysel"><option value="">Mọi ngày</option>' + keys.map(function(d){
      return '<option value="' + d + '"' + (S.day === d ? " selected" : "") + '>' + d + " · " + days[d] + " từ</option>";
    }).join("") + "</select>");
  }
  if(S.tab === "vocab")
    h.push('<button class="chip" id="sortbtn" aria-pressed="' + (S.sort === "az") + '">A → Z</button>');
  h.push('<span class="count">' + (S.tab === "known" ? S.known.length + " từ đã biết" : S.view.length + " mục") + "</span>");
  filtersEl.innerHTML = h.join("");
}
function chip(val, label, on){
  return '<button class="chip" data-pos="' + esc(val) + '" aria-pressed="' + !!on + '">' + esc(label) + "</button>";
}

function renderVocab(){
  if(!S.view.length){ listEl.innerHTML = '<div class="panel"><div class="empty">Không có từ nào khớp.</div></div>'; return; }
  var h = ['<div class="panel">'], day = null;
  S.view.forEach(function(r){
    if(S.sort === "new" && r.date !== day){
      day = r.date;
      var n = S.view.filter(function(x){ return x.date === day; }).length;
      h.push('<div class="day"><b>' + esc(day) + "</b> · " + n + " từ</div>");
    }
    h.push('<div class="row" data-id="' + esc(r.id) + '" aria-current="' + (S.current === r.id) + '">' +
      '<span class="w">' + esc(r.word) + "</span>" +
      '<span class="pos">' + esc(r.pos) + "</span>" +
      '<span class="gloss">' + esc(r.meaning) + "</span>" +
      (r.times > 1 ? '<span class="rep">gặp ' + r.times + "×</span>" : "") +
      "</div>");
  });
  h.push("</div>");
  listEl.innerHTML = h.join("");
}

function renderGrammar(){
  if(!S.view.length){ listEl.innerHTML = '<div class="panel"><div class="empty">Không có câu nào khớp.</div></div>'; return; }
  var h = ['<div class="panel">'];
  S.view.forEach(function(r){
    h.push('<div class="gcard">' +
      '<div class="gday">' + esc(r.date) + "</div>" +
      '<div class="gbad">' + esc(r.original) + "</div>" +
      '<div class="ggood">' + esc(r.corrected) + "</div>" +
      (r.fixes.length ? '<ul class="gfix">' + r.fixes.map(function(f){
        return "<li><span class=\"tag\">" + esc(f.tag) + "</span>" + esc(f.body) + "</li>"; }).join("") + "</ul>" : "") +
      (r.deep ? '<div class="deep" style="margin-top:8px">' + esc(r.deep) + "</div>" : "") +
      "</div>");
  });
  h.push("</div>");
  listEl.innerHTML = h.join("");
}

function renderKnown(){
  var q = S.q.trim().toLowerCase();
  var words = S.known.filter(function(w){ return !q || w.indexOf(q) >= 0; });
  listEl.innerHTML = '<div class="panel"><div class="known">' + (words.length
    ? words.map(function(w){ return '<button data-known="' + esc(w) + '">' + esc(w) + "</button>"; }).join("")
    : '<div class="empty">Không có từ nào khớp.</div>') + "</div></div>";
}

/* ---------------------------------------------------------------- overview */
function renderOverview(){
  var v = S.vocab, days = {}, pos = {};
  v.forEach(function(r){
    days[r.date] = (days[r.date] || 0) + 1;
    pos[r.posKey] = (pos[r.posKey] || 0) + 1;
  });
  var dayKeys = Object.keys(days).sort();
  var span = dayKeys.length ? daySpan(dayKeys[0], dayKeys[dayKeys.length - 1]) : 0;
  var last = dayKeys[dayKeys.length - 1] || "—";
  var week = v.filter(function(r){ return daySpan(r.date, last) < 7; }).length;
  var repeats = v.filter(function(r){ return r.times > 1; });

  var series = fullDays(dayKeys, days);        // mọi ngày trong khoảng, kể cả ngày trống
  var max = series.reduce(function(m, d){ return Math.max(m, d.n); }, 1);

  var h = [];
  h.push('<div class="kpis">' +
    kpi(v.length, "từ trong sổ") +
    kpi(dayKeys.length, "ngày có gom từ") +
    kpi(span ? (v.length / span).toFixed(1) : "—", "từ / ngày (cả ngày trống)") +
    kpi(week, "từ trong 7 ngày cuối") +
    kpi(repeats.length, "từ gặp lại ≥ 2 lần") +
    kpi(S.grammar.length, "câu được sửa ngữ pháp") +
    "</div>");

  h.push('<div class="card"><h2>Từ mới theo ngày · ' + esc(series[0] ? series[0].d : "") + " → " + esc(last) + "</h2>" +
    '<div class="bars">' + series.map(function(d){
      return '<div class="bar' + (d.n ? "" : " zero") + '" style="height:' +
        (d.n ? Math.max(4, Math.round(d.n / max * 100)) : 2) + '%" title="' + d.d + ": " + d.n + ' từ"></div>';
    }).join("") + "</div>" +
    '<div class="axis"><span>' + esc(series[0] ? series[0].d : "") + "</span><span>đỉnh " + max + " từ/ngày</span><span>" + esc(last) + "</span></div></div>");

  h.push('<div class="two">');
  h.push('<div class="card"><h2>Loại từ</h2><div class="dist">' + BUCKETS.concat([["other", "khác"]]).filter(function(b){ return pos[b[0]]; })
    .sort(function(a, b){ return pos[b[0]] - pos[a[0]]; })
    .map(function(b){
      var n = pos[b[0]];
      return "<span>" + esc(b[1]) + '</span><span class="track"><span class="fill" style="width:' +
        Math.round(n / v.length * 100) + '%"></span></span><span class="n">' + n + "</span>";
    }).join("") + "</div></div>");

  h.push('<div class="card"><h2>Ngày gom nhiều nhất</h2><ul class="mini">' +
    dayKeys.slice().sort(function(a, b){ return days[b] - days[a]; }).slice(0, 8).map(function(d){
      return '<li class="clickable" data-day="' + d + '"><b>' + d + "</b><span>" + days[d] + " từ</span></li>";
    }).join("") + "</ul></div>");
  h.push("</div>");

  h.push('<div class="two">');
  h.push('<div class="card"><h2>Mới nhất</h2><ul class="mini">' + v.slice(0, 10).map(function(r){
    return '<li class="clickable" data-id="' + esc(r.id) + '"><b>' + esc(r.word) + "</b><span>" + esc(r.date) + "</span></li>"; }).join("") + "</ul></div>");
  h.push('<div class="card"><h2>Gặp lại nhiều lần</h2><ul class="mini">' + (repeats.length
    ? repeats.slice().sort(function(a, b){ return b.times - a.times; }).slice(0, 10).map(function(r){
        return '<li class="clickable" data-id="' + esc(r.id) + '"><b>' + esc(r.word) + "</b><span>" + r.times + "×</span></li>"; }).join("")
    : '<li class="muted">chưa có từ nào lặp lại</li>') + "</ul></div>");
  h.push("</div>");

  listEl.innerHTML = h.join("");
}
function kpi(v, l){ return '<div class="kpi"><div class="v">' + esc(v) + '</div><div class="l">' + esc(l) + "</div></div>"; }
function daySpan(a, b){ return Math.round((Date.parse(b) - Date.parse(a)) / 86400000) + 1; }
function fullDays(keys, days){
  if(!keys.length) return [];
  var out = [], t = Date.parse(keys[0]), end = Date.parse(keys[keys.length - 1]);
  while(t <= end){
    var d = new Date(t).toISOString().slice(0, 10);
    out.push({d: d, n: days[d] || 0});
    t += 86400000;
  }
  return out;
}

/* ------------------------------------------------------------------ detail */
function openWord(id){
  var r = S.vocab.filter(function(x){ return x.id === id; })[0];
  if(!r) return;
  S.current = id;
  if(S.tab === "overview" || S.tab === "grammar"){ S.tab = "vocab"; render(); }
  else document.querySelectorAll(".row").forEach(function(el){
    el.setAttribute("aria-current", String(el.dataset.id === id)); });
  detailEl.hidden = false;
  history.replaceState(null, "", "#w=" + encodeURIComponent(id));
  paintCard(r);
  document.body.classList.add("open");
  detailEl.scrollTop = 0;
  lookup(r.word);
}
function paintCard(r){
  var h = ['<div class="hero"><h1>' + esc(r.word) + "</h1>" +
    (r.ipa ? '<span class="ipa">' + esc(r.ipa) + "</span>" : "") +
    '<button class="say" data-say="' + esc(r.word) + '">🔊 nghe</button></div>'];
  h.push('<div class="meta">' + esc(r.pos || "—") + " · gom ngày " + esc(r.date) +
    (r.times > 1 ? " · gặp lại " + r.times + " lần" : "") + " · id " + esc(r.id) + "</div>");
  if(r.meaning) h.push('<div class="lbl">Nghĩa</div><div class="meaning">' + esc(r.meaning) + "</div>");
  if(r.collocation) h.push('<div class="lbl">Collocations</div><div class="colls">' +
    r.collocation.split("·").map(function(c){ return '<span class="coll">' + esc(c.trim()) + "</span>"; }).join("") + "</div>");
  if(r.example) h.push('<div class="lbl">Ví dụ đã gặp</div>' +
    r.example.split("\n").filter(Boolean).map(function(e){ return '<p class="ex">' + esc(e) + "</p>"; }).join(""));
  if(r.deep) h.push('<div class="lbl">Deep dive</div><div class="deep">' + esc(r.deep) + "</div>");
  h.push(linksFor(r.word));
  h.push('<div class="dict" id="dict"></div>');
  detailEl.innerHTML = h.join("");
}
function openBare(word){
  S.current = null;
  detailEl.hidden = false;
  detailEl.innerHTML = '<div class="hero"><h1>' + esc(word) + "</h1>" +
    '<button class="say" data-say="' + esc(word) + '">🔊 nghe</button></div>' +
    '<div class="meta">từ trong known-words.txt — không vào sổ</div>' +
    linksFor(word) + '<div class="dict" id="dict"></div>';
  document.body.classList.add("open");
  lookup(word);
}
function linksFor(w){
  var e = encodeURIComponent(w);
  return '<div class="links">' +
    '<a target="_blank" rel="noopener" href="https://dictionary.cambridge.org/dictionary/english/' + e + '">Cambridge</a>' +
    '<a target="_blank" rel="noopener" href="https://www.oxfordlearnersdictionaries.com/definition/english/' + e + '">Oxford</a>' +
    '<a target="_blank" rel="noopener" href="https://youglish.com/pronounce/' + e + '/english/us">YouGlish</a>' +
    '<a target="_blank" rel="noopener" href="https://www.google.com/search?q=' + e + '+meaning">Google</a>' +
    "</div>";
}

/* Tra tại chỗ bằng dictionaryapi.dev — đúng API mà lookup.py dùng, nên nghĩa
   đọc ở đây và nghĩa trên thẻ Anki cùng một nguồn. Hỏng mạng thì chỉ mất phần
   này, thẻ ở trên vẫn đọc được. */
function lookup(word){
  var box = $("#dict");
  if(!box) return;
  if(dictCache.has(word)){ paintDict(box, word, dictCache.get(word)); return; }
  box.innerHTML = '<span class="muted"><span class="spin"></span> đang tra api.dictionaryapi.dev…</span>';
  fetch(API + encodeURIComponent(word.toLowerCase()))
    .then(function(res){ return res.ok ? res.json() : Promise.reject(res.status); })
    .then(function(data){ dictCache.set(word, data); paintDict(box, word, data); })
    .catch(function(err){
      var msg = err === 404
        ? "Từ điển không có mục cho từ này (thường gặp với cụm nhiều chữ) — dùng các link ở trên."
        : "Không gọi được từ điển (" + esc(err) + ").";
      dictCache.delete(word);
      box.innerHTML = '<div class="muted">' + msg + "</div>";
    });
}
function paintDict(box, word, data){
  var h = ['<div class="lbl">Từ điển · dictionaryapi.dev</div>'], audio = [];
  data.forEach(function(entry){
    (entry.phonetics || []).forEach(function(p){ if(p.audio) audio.push(p.audio); });
    (entry.meanings || []).forEach(function(m){
      h.push('<div class="dictpos">' + esc(m.partOfSpeech) + "</div>");
      (m.definitions || []).slice(0, 3).forEach(function(d){
        h.push('<div class="sense">' + esc(d.definition) +
          (d.example ? "<i>“" + esc(d.example) + "”</i>" : "") + "</div>");
      });
      if((m.synonyms || []).length)
        h.push('<div class="muted">≈ ' + esc(m.synonyms.slice(0, 6).join(", ")) + "</div>");
    });
  });
  var us = audio.filter(function(u){ return /-us\.mp3$/.test(u); })[0] || audio[0];
  if(us) box.dataset.audio = us;
  box.innerHTML = h.join("");
}

/* ------------------------------------------------------------------- audio */
function say(word){
  var box = $("#dict");
  var url = box && box.dataset.audio;
  if(url){ new Audio(url).play().catch(function(){ speak(word); }); return; }
  speak(word);
}
function speak(word){
  if(!window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(word);
  u.lang = "en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ------------------------------------------------------------------ events */
document.addEventListener("click", function(e){
  var t = e.target;
  var tab = t.closest(".tabs button");
  if(tab){ S.tab = tab.dataset.tab; render(); return; }
  var row = t.closest("[data-id]");
  if(row){ openWord(row.dataset.id); return; }
  var dayLi = t.closest("[data-day]");
  if(dayLi){ S.day = dayLi.dataset.day; S.tab = "vocab"; render(); return; }
  var known = t.closest("[data-known]");
  if(known){ openBare(known.dataset.known); return; }
  var sayBtn = t.closest("[data-say]");
  if(sayBtn){ say(sayBtn.dataset.say); return; }
  var posChip = t.closest("[data-pos]");
  if(posChip){ S.pos = posChip.dataset.pos; render(); return; }
  if(t.id === "sortbtn"){ S.sort = S.sort === "az" ? "new" : "az"; render(); return; }
  if(t.id === "close"){ document.body.classList.remove("open"); return; }
  if(t.id === "rand"){
    if(!S.vocab.length) return;
    openWord(S.vocab[Math.floor(Math.random() * S.vocab.length)].id);
    return;
  }
  if(t.id === "theme"){
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("vocab-theme", next); } catch(_){}
  }
});
document.addEventListener("change", function(e){
  if(e.target.id === "daysel"){ S.day = e.target.value; render(); }
});
$("#q").addEventListener("input", function(e){
  S.q = e.target.value;
  if(S.tab === "overview") S.tab = "vocab";
  render();
});
document.addEventListener("keydown", function(e){
  if(e.key === "/" && e.target.tagName !== "INPUT"){ e.preventDefault(); $("#q").focus(); }
  if(e.key === "Escape"){ document.body.classList.remove("open"); }
});

/* -------------------------------------------------------------------- load */
function parse(text){
  var out = [];
  text.split("\n").forEach(function(line){
    line = line.trim();
    if(!line) return;
    try { out.push(JSON.parse(line)); } catch(_){}
  });
  return out;
}
try {
  var saved = localStorage.getItem("vocab-theme");
  if(saved) document.documentElement.dataset.theme = saved;
} catch(_){}

Promise.all([
  fetch("history.jsonl", {cache: "no-cache"}).then(function(r){ return r.text(); }),
  fetch("known-words.txt", {cache: "no-cache"}).then(function(r){ return r.ok ? r.text() : ""; }).catch(function(){ return ""; })
]).then(function(res){
  var built = build(parse(res[0]));
  S.vocab = built.vocab;
  S.grammar = built.grammar;
  S.known = res[1].split("\n").map(function(w){ return w.trim().toLowerCase(); }).filter(Boolean);
  S.updated = S.vocab.length ? S.vocab[0].date : "";
  $("#stamp").textContent = S.vocab.length + " từ · mới nhất " + S.updated;
  $("#foot").innerHTML = "Dựng thẳng từ <code>history.jsonl</code> trong repo này — cùng nguồn với " +
    "<code>my-vocab-sheet.xlsx</code> mà sheets2anki đọc. Bấm <kbd>/</kbd> để tìm.";
  render();
  var m = /#w=(.+)/.exec(location.hash);
  if(m) openWord(decodeURIComponent(m[1]));
}).catch(function(err){
  listEl.innerHTML = '<div class="panel"><div class="empty">Không đọc được <code>history.jsonl</code>: ' +
    esc(err) + "</div></div>";
});
})();
</script>
